name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --tag dvc-services:ci .
      - name: Check production image
        run: |
          test "$(docker run --rm --entrypoint id dvc-services:ci -u)" != "0"
          docker run --rm --entrypoint node dvc-services:ci --input-type=module -e "import { VERSION } from './dist/version.js'; import 'discord.js'; if (VERSION !== '0.1.2') process.exit(1);"
          docker run --rm --entrypoint node dvc-services:ci --input-type=module -e "import { existsSync } from 'node:fs'; if (existsSync('.env') || existsSync('node_modules/typescript')) process.exit(1);"
