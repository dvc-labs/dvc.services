name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker build --tag dvc-services:ci .
      - name: Check production image
        run: |
          test "$(docker run --rm --entrypoint id dvc-services:ci -u)" != "0"
          docker run --rm --entrypoint node dvc-services:ci --input-type=module -e "import { VERSION } from './dist/version.js'; import 'discord.js'; if (VERSION !== '0.1.0') process.exit(1);"
          docker run --rm --entrypoint node dvc-services:ci --input-type=module -e "import { existsSync } from 'node:fs'; if (existsSync('.env') || existsSync('node_modules/typescript')) process.exit(1);"
