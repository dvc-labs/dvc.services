version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Keep compile-time Node APIs aligned with the supported Node 24 runtime.
      - dependency-name: '@types/node'
        versions: ['>=25']
    groups:
      development-dependencies:
        dependency-type: development
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Runtime major upgrades need an explicit LTS/support review.
      - dependency-name: node
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
