services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    mem_limit: 512m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
    # No published ports or persistent volumes are needed.
    # Docker checks /readyz internally; Discord uses an outbound Gateway session.
